<style>
*{box-sizing:border-box}
:root{--ui-bg:#0b100f;--ui-panel:#14171b;--ui-inset:#202724;--ui-edge:#8a7a5a;--ui-inner:#394034;--ui-gold:#d6ad59;--ui-text:#e8e2d0;--ui-muted:#b7ad94;--ui-blue:#9cc4ec;--ui-font:'Pixelify Sans',monospace}

body{font-family:var(--ui-font)}
#game-shell{height:100vh;height:100dvh;width:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

[data-touch-enabled="true"] #game{border:2px solid var(--ui-edge);box-shadow:0 0 0 2px #070b0a,inset 0 0 0 1px var(--ui-inner);background:var(--ui-bg)}
[data-touch-enabled="true"] #mobile-controls{display:grid;gap:8px;width:min(100%,560px);justify-self:center}
.mobile-toolbar{display:flex;justify-content:flex-end;gap:8px}
.mobile-control,.mobile-game-dialog button{min-width:44px;min-height:48px;border:2px solid var(--ui-edge);border-radius:0;background:var(--ui-panel);color:var(--ui-text);font:400 16px/1.15 var(--ui-font);box-shadow:inset 0 0 0 2px #0b100f,inset 0 4px 0 #343930,0 3px 0 #070b0a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:10px;overflow-wrap:anywhere;hyphens:auto;cursor:pointer;text-shadow:1px 1px #070b0a}
.mobile-toolbar button{min-width:88px}
.mobile-control:active,.mobile-control.is-pressed,.mobile-control[aria-pressed="true"],.mobile-game-dialog button:active{background:#2d3b31;border-color:var(--ui-gold);box-shadow:inset 0 0 0 2px #111914,inset 0 4px 0 #17201a,0 1px 0 #070b0a;color:#fff4d8}

.mobile-control:disabled{opacity:.45;cursor:default}
.mobile-toolbar button{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.mobile-bag::before{content:'';width:24px;height:24px;flex:none;background:url('/assets/ui/inventory-bag.png') center/24px 24px no-repeat;image-rendering:pixelated}
.mobile-settings::before{content:'';width:16px;height:16px;flex:none;background:linear-gradient(var(--ui-panel),var(--ui-panel)) center/4px 4px no-repeat,var(--ui-muted);clip-path:polygon(37.5% 0,62.5% 0,62.5% 12.5%,87.5% 12.5%,87.5% 37.5%,100% 37.5%,100% 62.5%,87.5% 62.5%,87.5% 87.5%,62.5% 87.5%,62.5% 100%,37.5% 100%,37.5% 87.5%,12.5% 87.5%,12.5% 62.5%,0 62.5%,0 37.5%,12.5% 37.5%,12.5% 12.5%,37.5% 12.5%)}
.mobile-caption,.mobile-game-dialog{border:2px solid var(--ui-edge);border-radius:0;background:var(--ui-panel);color:var(--ui-text);box-shadow:inset 0 0 0 2px #0b100f,inset 0 0 0 3px var(--ui-inner),0 3px 0 #070b0a}

.mobile-dialogue-portrait{position:absolute;left:-2px;bottom:100%;margin-bottom:0;width:100px;height:100px;border:2px solid var(--ui-edge);border-bottom:0;background:var(--ui-panel);box-shadow:inset 0 0 0 2px #0b100f;overflow:hidden}

.mobile-dialogue-face[data-fallback="true"]::before{content:'';position:absolute;left:30px;top:10px;width:32px;height:38px;background:#8a7a5a;clip-path:polygon(25% 0,75% 0,100% 25%,88% 80%,65% 100%,35% 100%,12% 80%,0 25%)}
.mobile-dialogue-face[data-fallback="true"]::after{content:'';position:absolute;left:12px;right:12px;top:50px;height:46px;background:#655e4e;clip-path:polygon(25% 0,75% 0,100% 35%,100% 100%,0 100%,0 35%)}
.mobile-identity{font-size:13px;color:var(--ui-gold);letter-spacing:1px}
[data-mobile-objective]{font-weight:600}
[data-mobile-thought]{color:var(--ui-text);overflow-wrap:anywhere}
[data-mobile-battle-status]{white-space:pre-line;color:var(--ui-text)}
.mobile-dialogue-measure{visibility:hidden;pointer-events:none;overflow-wrap:anywhere}
.mobile-caption-text:has(.mobile-dialogue-measure:not([hidden])){display:grid}
.mobile-caption-text:has(.mobile-dialogue-measure:not([hidden])) :is([data-mobile-thought],.mobile-dialogue-measure){grid-area:1/1;margin:0}
.mobile-reader-announcement{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

[data-mobile-hint]{font-size:13px;color:var(--ui-muted)}
.mobile-input-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mobile-dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px;flex:none}
.mobile-direction{font-size:24px;padding:0;color:#e8d5ac;min-height:48px}

[data-direction="left"]{grid-area:2/1}
[data-direction="down"]{grid-area:3/2}
[data-direction="right"]{grid-area:2/3}
.mobile-actions{display:grid;grid-template-columns:repeat(2,minmax(44px,1fr));gap:6px;max-width:240px;flex:1}
.mobile-action{display:flex;align-items:center;justify-content:center;gap:6px}
.mobile-action:is([data-key="Q"],[data-key="R"],[data-key="SPACE"],[data-key="ENTER"],[data-key="ESC"])::before{content:'';width:24px;height:24px;flex:none;background:url('/assets/ui/icons.png') 0 0/288px 24px no-repeat;image-rendering:pixelated}
.mobile-action[data-key="R"]::before{background-position:-24px 0}
.mobile-action[data-key="SPACE"]::before{background-position:-48px 0}
.mobile-action[data-key="ENTER"]::before{background-position:-72px 0}
.mobile-action[data-key="ESC"]::before{background-position:-216px 0}
.mobile-actions>.mobile-control:only-of-type{grid-column:1/-1;min-height:60px}
#mobile-controls[data-control-mode="cinematic"] .mobile-actions{grid-template-columns:minmax(44px,1fr)}
#mobile-controls[data-control-mode="cinematic"] .mobile-input-row{justify-content:center}
#mobile-controls[data-control-mode="cinematic"] .mobile-action:not([hidden]){grid-column:1/-1;min-height:64px}
#mobile-controls:is([data-scene="world"],[data-scene="lia"],[data-scene="raid"],[data-scene="aftermath"],[data-scene="journey"],[data-scene="title"]) .mobile-action:not([hidden]){grid-column:1/-1;min-height:64px}
.mobile-bookmarks{grid-column:1/-1;display:flex;gap:6px}
.mobile-bookmarks button{flex:1}
.mobile-game-dialog{box-sizing:border-box;width:min(420px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;margin:auto;padding:20px;font:16px/1.45 var(--ui-font);scrollbar-color:var(--ui-edge) var(--ui-bg);scrollbar-width:thin}
.mobile-game-dialog::backdrop{background:rgba(7,11,10,.9)}
.mobile-game-dialog h2{margin:0 0 16px;padding-bottom:12px;border-bottom:2px solid var(--ui-inner);font-size:24px;font-weight:400;color:#f1e6c9;text-shadow:2px 2px #070b0a}
.mobile-game-dialog button{min-height:48px;padding:10px 18px;touch-action:manipulation}
.mobile-game-dialog label{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
.mobile-game-dialog input[type=range]{display:block;width:100%;height:48px;margin:0;accent-color:var(--ui-gold);touch-action:pan-x}
.mobile-game-dialog input[type=range]::-webkit-slider-runnable-track{height:8px;border:2px solid var(--ui-edge);border-radius:0;background:var(--ui-bg)}
.mobile-game-dialog input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:24px;margin-top:-10px;border:2px solid #e8d5ac;border-radius:0;background:var(--ui-edge);box-shadow:inset 0 0 0 2px #394034}
.mobile-game-dialog input[type=range]::-moz-range-track{height:8px;border:2px solid var(--ui-edge);border-radius:0;background:var(--ui-bg)}
.mobile-game-dialog input[type=range]::-moz-range-thumb{width:18px;height:24px;border:2px solid #e8d5ac;border-radius:0;background:var(--ui-edge);box-shadow:inset 0 0 0 2px #394034}
.mobile-game-dialog input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
.mobile-game-dialog input[type=checkbox]{appearance:none;width:26px;height:26px;margin:0;border:2px solid var(--ui-edge);border-radius:0;background:var(--ui-bg);flex:none;display:grid;place-content:center}
.mobile-game-dialog input[type=checkbox]:checked::before{content:'';width:14px;height:14px;background:var(--ui-gold);clip-path:polygon(0 42%,28% 42%,28% 70%,72% 0,100% 0,100% 28%,42% 100%,28% 100%,0 70%)}
.mobile-game-dialog input:disabled{opacity:.4}
.mobile-game-dialog .mobile-dialog-content{margin-bottom:18px}
.mobile-game-dialog ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.mobile-game-dialog li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px;border:1px solid var(--ui-inner);box-shadow:inset 0 0 0 1px #070b0a;background:#101512}
.mobile-game-dialog li>span:last-child{color:var(--ui-gold);white-space:nowrap}
.mobile-item-name{display:flex;align-items:center;gap:12px;min-width:0}
.mobile-item-icon{display:inline-block;width:32px;height:32px;flex:none;background-repeat:no-repeat;image-rendering:pixelated}
.mobile-game-dialog output{color:var(--ui-gold)}
.mobile-game-dialog p{margin:8px 0;color:var(--ui-muted)}
.mobile-game-dialog .mobile-dialog-close{width:100%}
#mobile-controls[hidden],#mobile-controls [hidden]{display:none!important}
.party-portrait-control{position:fixed;z-index:1400;min-width:44px;min-height:44px;border:2px solid var(--ui-edge);padding:2px;background:var(--ui-panel);cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 0 1px var(--ui-inner)}
.party-portrait-control img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.party-portrait-control[hidden]{display:none}
.party-portrait-control:focus-visible{outline:3px solid var(--ui-gold);outline-offset:3px}
#character-dialog{width:min(840px,calc(100vw - 24px));font-size:18px;line-height:1.45;padding:24px;overscroll-behavior:contain}
#character-dialog h2{font-size:26px}
#character-dialog h3{font-size:24px;margin:0 0 6px;font-weight:400;color:var(--ui-text)}
.party-layout{display:grid;grid-template-columns:132px minmax(0,1fr);gap:20px}
.party-roster{display:flex;flex-direction:column;gap:8px}
#character-dialog .party-roster button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;font-size:18px;min-width:0}
.party-roster img{width:64px;height:64px;object-fit:cover;image-rendering:auto;border:1px solid var(--ui-edge)}
.sprite-portrait{display:block;width:96px;height:96px;background-repeat:no-repeat;image-rendering:pixelated;flex:none;border:2px solid var(--ui-edge)}
.party-roster .sprite-portrait{width:64px;height:64px;border-width:1px}
#character-dialog :is(button[aria-pressed="true"],button[aria-selected="true"]){border-color:var(--ui-gold);background:#2d3b31;color:#fff4d8}
.character-profile{display:flex;align-items:center;gap:20px;margin-bottom:20px;padding:16px;border:1px solid var(--ui-edge);background:#101512}
.character-profile img{width:96px;height:96px;object-fit:cover;border:2px solid var(--ui-edge);image-rendering:auto;flex:none}
#character-dialog .character-profile p{margin:0}
.character-details{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#character-dialog .character-details button{flex:1;font-size:18px;padding:10px 8px;min-width:100px}
#character-dialog dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:0;gap:0 16px}
#character-dialog :is(dt,dd){margin:0;padding:14px 0;border-bottom:1px solid var(--ui-inner)}
#character-dialog dd{text-align:right;color:var(--ui-gold)}
#character-dialog .character-ability{display:block}
#character-dialog .character-ability p{color:var(--ui-muted);margin-top:6px}
#character-dialog .character-ability kbd{float:right;font:inherit;color:var(--ui-gold);margin-left:12px}
#character-dialog :is(button,[role="tabpanel"]):focus-visible{outline:3px solid var(--ui-gold);outline-offset:3px}
.bag-item-icon{display:block;width:32px;height:32px;flex:none;background-repeat:no-repeat;image-rendering:pixelated}
#character-dialog .equipment-items li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px}
#bag-dialog{width:min(580px,calc(100vw - 16px));padding:8px;border:0;box-shadow:none;background:transparent;overflow:auto;font-size:18px;overscroll-behavior:contain}

#bag-dialog .mobile-dialog-content{margin:0}
.open-bag-interior{position:relative;width:min(100%,calc((100dvh - 144px) * 3 / 4),510px);aspect-ratio:3/4;margin-inline:auto;border:12px ridge #705034;border-radius:26% 26% 16% 16%;background:radial-gradient(ellipse at 50% 15%,#15100b 0,#342619 48%,#6c4c2e 100%);box-shadow:inset 0 0 30px #090705,0 8px 14px #0009}
.open-bag-interior[data-art="true"]{border:0;border-radius:0;background:none;box-shadow:none}
.bag-artwork{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#bag-dialog .bag-items{position:absolute;inset:27% 16% 24%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:10px;overflow:auto;padding:4px;overscroll-behavior:contain;scrollbar-color:var(--ui-edge) #1c130c}
#bag-dialog .bag-items li{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;min-height:110px;padding:12px 8px;border:1px solid #a17c4a;background:#17130ecc;box-shadow:inset 0 0 0 1px #0b0805;text-align:center;overflow-wrap:anywhere;font-size:18px;line-height:1.2}

@media(orientation:landscape) and (max-height:600px){
  #bag-dialog .bag-items{grid-template-columns:minmax(0,1fr);gap:8px}
  #bag-dialog .bag-items li{font-size:17px;min-height:100px;padding:10px 6px}

}
@media(max-width:600px){
  #character-dialog{padding:18px;font-size:18px}
  .party-layout{grid-template-columns:minmax(0,1fr);gap:16px}
  .party-roster{flex-direction:row;overflow:auto;padding:4px 0}
  #character-dialog .party-roster button{min-width:96px;flex:none}

  .character-profile .sprite-portrait{width:80px;height:80px}
  #character-dialog dl{grid-template-columns:minmax(0,1fr) minmax(100px,1fr)}

  #bag-dialog .bag-items li{font-size:17px;min-height:108px}

@media(orientation:landscape) and (max-height:600px){
  [data-touch-enabled="true"] #game-shell{grid-template-columns:136px minmax(0,1fr) 144px;grid-template-rows:minmax(0,1fr) 88px;align-content:stretch;gap:6px}
  [data-touch-enabled="true"] #game{grid-area:1/2;width:auto;height:auto;aspect-ratio:auto}

  [data-touch-enabled="true"] #game-shell{grid-template-columns:106px minmax(0,1fr) 112px}

  .mobile-actions{grid-template-columns:repeat(2,minmax(44px,1fr));gap:4px}
  .mobile-control{font-size:13px;padding:4px}
  .mobile-action[data-key="E"]{grid-column:1/-1}
  .mobile-action:not([data-key="E"]){font-size:0;gap:0}
  .mobile-action:not([data-key="E"])::before{display:block}
}
