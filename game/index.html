<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07080a;color:#e3dfd1;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,sans-serif}
#game-shell{height:100vh;height:100dvh;width:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden}
#game canvas{display:block;image-rendering:pixelated;touch-action:none}
#mobile-controls{display:none}
[data-touch-enabled="true"] #game-shell{grid-template-rows:minmax(0,auto) auto;align-content:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:8px}
[data-touch-enabled="true"] #game{width:100%;height:auto;aspect-ratio:16/9}
[data-touch-enabled="true"] #mobile-controls{display:grid;gap:8px;width:min(100%,560px);justify-self:center}
.mobile-toolbar{display:flex;justify-content:flex-end;gap:8px}
.mobile-toolbar button,.mobile-control,.mobile-bookmarks button{min-width:44px;min-height:44px;border:1px solid #8a7a5a;border-radius:7px;background:#19231f;color:#f1e6c9;font:600 14px system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:8px;overflow-wrap:anywhere;hyphens:auto}
.mobile-toolbar button{min-width:88px}
.mobile-control:active,.mobile-control.is-pressed,.mobile-control[aria-pressed="true"],.mobile-bookmarks button[aria-pressed="true"]{background:#38513f;border-color:#e2bd70;box-shadow:inset 0 0 0 1px #e2bd70}
.mobile-control:focus-visible,.mobile-toolbar button:focus-visible,.mobile-bookmarks button:focus-visible{outline:2px solid #e2bd70;outline-offset:2px}
.mobile-control:disabled{opacity:.45}
.mobile-caption{min-height:62px;max-height:124px;padding:6px 10px;border-left:2px solid #8a7a5a;background:#111914;line-height:1.3;font-size:14px;overflow:auto;overscroll-behavior:contain}
.mobile-caption p{margin:0}
.mobile-caption>*+*{margin-top:3px}
.mobile-identity{font-size:12px;color:#b4c5b1}
[data-mobile-objective]{font-weight:600}
[data-mobile-thought]{color:#d3dfeb}
[data-mobile-hint]{font-size:12px;color:#c4c0ad}
.mobile-input-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mobile-dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:2px;flex:none}
.mobile-direction{font-size:22px;padding:0}
[data-direction="up"]{grid-area:1/2}
[data-direction="left"]{grid-area:2/1}
[data-direction="down"]{grid-area:3/2}
[data-direction="right"]{grid-area:2/3}
.mobile-actions{display:grid;grid-template-columns:repeat(2,minmax(44px,1fr));gap:6px;max-width:240px;flex:1}
.mobile-actions>.mobile-control:only-of-type{grid-column:1/-1;min-height:60px}
#mobile-controls[data-control-mode="cinematic"] .mobile-actions{grid-template-columns:minmax(44px,1fr)}
#mobile-controls[data-control-mode="cinematic"] .mobile-action:not([hidden]){grid-column:1/-1;min-height:64px}
#mobile-controls:is([data-scene="world"],[data-scene="lia"],[data-scene="raid"],[data-scene="aftermath"],[data-scene="journey"],[data-scene="title"]) .mobile-action:not([hidden]){grid-column:1/-1;min-height:64px}
.mobile-bookmarks{grid-column:1/-1;display:flex;gap:6px}
.mobile-bookmarks button{flex:1}
#mobile-controls[hidden],#mobile-controls [hidden]{display:none!important}
@media(orientation:landscape) and (max-height:600px){
  [data-touch-enabled="true"] #game-shell{grid-template-columns:136px minmax(0,1fr) 144px;grid-template-rows:minmax(0,1fr) 66px;align-content:stretch;gap:6px}
  [data-touch-enabled="true"] #game{grid-area:1/2;width:auto;height:auto;aspect-ratio:auto}
  [data-touch-enabled="true"] #mobile-controls,[data-touch-enabled="true"] .mobile-input-row{display:contents}
  .mobile-dpad{grid-area:1/1;align-self:center;justify-self:center}
  .mobile-actions{grid-area:1/3;align-self:center;width:100%;max-width:none}
  .mobile-caption{grid-area:2/1/3/3;min-height:0;align-self:stretch;font-size:13px;padding:3px 8px;overflow:auto}
  .mobile-toolbar{grid-area:2/3;align-self:center;display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .mobile-toolbar button{min-width:0;padding:4px;font-size:12px}
}
@media(orientation:landscape) and (max-width:600px){
  [data-touch-enabled="true"] #game-shell{grid-template-columns:106px minmax(0,1fr) 112px}
  .mobile-dpad{grid-template-columns:repeat(2,48px);grid-template-rows:repeat(2,48px);gap:4px}
  [data-direction="up"]{grid-area:1/1}
  [data-direction="right"]{grid-area:1/2}
  [data-direction="left"]{grid-area:2/1}
  [data-direction="down"]{grid-area:2/2}
  .mobile-actions{gap:4px}
  .mobile-control{font-size:12px;padding:4px}
}
</style>
</head>
<body><main id="game-shell"><div id="game"></div></main><script type="module" src="/src/main.ts"></script></body>
</html>
