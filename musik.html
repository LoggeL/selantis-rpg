<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selantis · Musik</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101711;color:#f1ebda;font:16px/1.5 system-ui,sans-serif}main{max-width:760px;padding:42px 24px;margin:auto}h1{font:38px Georgia,serif;letter-spacing:.05em}a{color:#d5b87b;text-underline-offset:4px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:30px 0 20px}button{font:inherit;cursor:pointer;padding:10px 16px;border:1px solid #3d4939;border-radius:4px;background:#1b251c;color:#f1ebda}button[aria-pressed=true]{background:#d5b87b;color:#101711}button:focus-visible,a:focus-visible{outline:2px solid #d5b87b;outline-offset:4px}section{background:#1b251c;border:1px solid #3d4939;padding:24px}h2{font:24px Georgia,serif;margin:0 0 15px}audio{width:100%}small{color:#b5bcac}footer{display:flex;gap:24px;margin-top:25px;font-size:14px}
</style></head>
<body><main><small>Sechs Szenenstücke</small><h1>SELANTIS</h1>
<nav aria-label="Musik auswählen"><button aria-pressed="true" data-track="battle-dark" data-title="Schlacht" data-length="2:11">Schlacht</button><button aria-pressed="false" data-track="flight" data-title="Flucht" data-length="1:57">Flucht</button><button aria-pressed="false" data-track="refuge" data-title="Zuflucht" data-length="1:53">Zuflucht</button><button aria-pressed="false" data-track="exploration" data-title="Erkundung" data-length="1:59">Erkundung</button><button aria-pressed="false" data-track="dread" data-title="Entführung" data-length="1:55">Entführung</button><button aria-pressed="false" data-track="grief" data-title="Trauer" data-length="1:51">Trauer</button></nav>
<section><h2 id="track-title">Schlacht <small>2:11</small></h2><audio id="player" controls preload="none" aria-label="Szenenmusik abspielen" src="/output/audio/scenes/battle-dark-lyria-3-5.mp3"></audio></section>
<footer><a href="/">Spielen</a><a href="/konzept.html">Konzept &amp; Räuberlied</a></footer>
</main><script>
const player=document.getElementById('player'),title=document.getElementById('track-title');
const buttons=[...document.querySelectorAll('[data-track]')];
buttons.forEach(button=>button.addEventListener('click',()=>{
 const playing=!player.paused;player.pause();
 buttons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
 player.src=`/output/audio/scenes/${button.dataset.track}-lyria-3-5.mp3`;
 title.replaceChildren(document.createTextNode(`${button.dataset.title} `));
 const duration=document.createElement('small');duration.textContent=button.dataset.length;title.append(duration);
 if(playing)player.play().catch(()=>{});
}));
</script></body></html>
